# dsh-browser-playwright-codex bundle layer: the browser seam, the Playwright
# provider, and the model-facing tool family. Applied as one insert over the
# profile's entry list; rows are patchable by id like every other plugin.
#
# The `name:` values are package specifiers resolved from the profile, so they
# must track package.json#name — a rename that misses this file fails at load
# with MODULE_NOT_FOUND (2026-09-30: the 0.4.0 rename to *-codex did exactly
# that; verified `require.resolve('dsh-browser-playwright/service')` fails in
# both profiles while the *-codex specifier resolves).
- insert:
    - id: browser
      name: 'dsh-browser-playwright-codex/service'
      config:
        provider: playwright
    - id: browser-playwright
      name: 'dsh-browser-playwright-codex/playwright'
      config:
        launch:
          # Visible profile-backed window (persistent mode): the agent drives a
          # browser the user can watch and rescue. Set true for headless
          # servers. profileDir defaults to ~/.dsh/browser-profiles/playwright.
          headless: false
          persistent: true
          viewport:
            width: 1280
            height: 800
          navigationTimeoutMs: 30000
          ignoreHTTPSErrors: false
        # Idle auto-close: ms of no agent activity before the window closes
        # itself (login state is saved first, so it reopens logged-in). 0 =
        # never auto-close; the window stays until the user closes it or DSH
        # exits. User choice: never auto-close (2026-09-04).
        idleTimeoutMs: 0
        maxSessions: 8
    - id: browser-tool
      name: 'dsh-browser-playwright-codex/tool'
      config:
        # This file ships INSIDE the package, so it must not turn anything on for
        # the people who install it. It used to: an earlier revision carried the
        # author's own `allowEvaluate: true` / `allowCdp: true` (2026-09-04) into
        # every download, which is how a package ends up handing each installer a
        # backdoor they never asked for — and it is what a third-party scanner
        # reads as "dynamic code execution, critical".
        #
        # Both are OFF here (matching the code defaults in src/tool.ts, and the
        # README's own configuration example). Opt in per deployment, in YOUR
        # profile patch — never in the package:
        #
        #   # ~/.dsh/profiles/<name>/cordis.patch.yml
        #   # NOTE: dsh replaces an entry's config object wholesale, so list every
        #   # key you rely on, not just the one you are changing.
        #   - id: browser-tool
        #     config:
        #       toolPrefix: 'browser_'
        #       allowEvaluate: true    # registers browser_evaluate
        #       allowCdp: true         # registers browser_cdp (needs a DSH restart)
        #       registerDisabledTools: false
        #       maxWaitMs: 60000
        #
        # browser_evaluate runs arbitrary page JavaScript: it can read anything in
        # the page and act on the user's logged-in sites. browser_cdp is CDP with
        # an allow-list — only inspection and input simulation pass
        # (lib/cdp-policy.js); network/storage/cookie/security commands never do.
        # Neither tool is registered at all while its gate is false.
        allowEvaluate: false
        allowCdp: false
