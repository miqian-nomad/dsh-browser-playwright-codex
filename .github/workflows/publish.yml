name: publish

# 从 GitHub 的机器发布到 npm：本机到 registry.npmjs.org 不通（代理只到 GitHub），
# 而 runner 的网络是通的。默认只跑 --dry-run，确认无误后再把 dry_run 关掉。
#
# 前置：仓库 secret 里要有 NPM_TOKEN（npm 的 Automation token，绕过 OTP）。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打包 + 预演（不真的发布）'
        type: boolean
        default: true
      package:
        description: '要发布的包（本仓库只有一个）'
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install (repo has a lockfile; fall back if needed)
        run: npm ci || npm install
      # 仓库里提交着 lib/，而 `dsh plugin add github:...` 装的是这棵树本身、不会 build。
      # 发布前先 build 一次，产物与提交的 lib/ 不一致就拒绝发布 —— 否则用户拿到的是旧产物。
      - name: Build
        run: npm run build
      - name: Committed lib/ is in sync with src/
        run: git diff --exit-code -- lib
      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
